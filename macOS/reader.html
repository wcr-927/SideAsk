<script>
const get = selector => document.querySelector(selector);
const panel = get('.note'), paper = get('.paper');
const pinned = get('.pin'), launcher = get('.reopen'), titleBar = get('.note header');
function showPanel(visible) {
  panel.hidden = !visible;
  launcher.hidden = visible;
  if (visible) refreshSource();
}
get('#hide').onclick = () => showPanel(false);
launcher.onclick = () => showPanel(true);
document.addEventListener('pointerdown', event => {
  // Native windows handle outside clicks in AppKit. This fallback is for the desktop mockup.
  if (window.webkit?.messageHandlers?.windowAction || document.querySelector('dialog[open]')) return;
  if (!panel.hidden && !panel.contains(event.target)) showPanel(false);
});
const preference = 'sideask-reading-window:' + screen.width + 'x' + screen.height;
function constrain(value, low, high) {
  return Math.min(Math.max(value, low), high);
}
function position(x, y, width) {
  const margin = 12;
  const maxWidth = innerWidth - margin * 2;
  width = constrain(width, Math.min(440, maxWidth), maxWidth);
  panel.style.width = width + 'px';
  panel.style.left = constrain(x, margin, innerWidth - width - margin) + 'px';
  panel.style.top = constrain(y, margin, innerHeight - panel.offsetHeight - margin) + 'px';
  panel.style.right = 'auto';
}
try {
  const saved = JSON.parse(localStorage.getItem(preference));
  if (Array.isArray(saved) && saved.length === 3 && saved.every(Number.isFinite)) position(...saved);
} catch {}
function attachDrag(handle, resizing) {
  handle.addEventListener('pointerdown', event => {
    if (event.button !== 0 || event.target.closest('button,[role=button]')) return;
    event.preventDefault();
    const box = panel.getBoundingClientRect(), startX = event.clientX, startY = event.clientY;
    handle.setPointerCapture(event.pointerId);
    handle.onpointermove = move => {
      const dx = move.clientX - startX;
      if (resizing) {
        const width = constrain(box.width - dx, Math.min(440,box.right-12), box.right-12);
        position(box.right - width,box.top,width);
      } else position(box.x + dx,box.y + move.clientY - startY,box.width);
      refreshSource();
    };
    handle.onlostpointercapture = () => {
      handle.onpointermove = null;
      const {x, y, width} = panel.getBoundingClientRect();
      try { localStorage.setItem(preference, JSON.stringify([x,y,width])); } catch {}
    };
  });
}
attachDrag(titleBar, false);
attachDrag(get('.grip'), true);
window.addEventListener('resize', () => {
  if (panel.hidden) return;
  const {x,y,width} = panel.getBoundingClientRect();
  position(x,y,width);
  refreshSource();
});
</script>
